- hosts: localhost
  gather_facts: false

  vars:
    project_dir: "{{ playbook_dir }}/.."
    staging_dir: "{{ project_dir }}/staging"

  tasks:
    - name: Create staging directory
      file:
        path: "{{ staging_dir }}"
        state: directory

    - name: VM inventory
      community.vmware.vmware_vm_info:
        hostname: "{{ vcenter _host }}"
        username: "{{ vcenter_user }}"
        password: "{{ vcenter_pass }}"
        validate_certs: false
        vm_type: vm
      register: vms

    - name: ESXi hosts
      community.vmware.vmware_host_info:
        hostname: "{{ vcenter_host }}"
        username: "{{ vcenter_user }}"
        password: "{{ vcenter_pass }}"
        validate_certs: false
      register: hosts

    - name: Datastores
      community.vmware.vmware_datastore_info:
        hostname: "{{ vcenter_host }}"
        username: "{{ vcenter_user }}"
        password: "{{ vcenter_pass }}"
        validate_certs: false
      register: ds

    - name: Save vCenter data to JSON
      copy:
        dest: "{{ staging_dir }}/vcenter.json"
        content: >-
          {{ {'run_id': run_id, 'collected_at': ansible_date_time.iso8601 | default(''),
              'source': 'vcenter',
              'vms': vms.virtual_machines,
              'hosts': hosts.hosts_info | default(hosts),
              'datastores': ds.datastores} | to_nice_json }}

