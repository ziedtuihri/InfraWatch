---
- name: Automate project Makefile workflows
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ playbook_dir }}/.."
    dockerhub_username: "{{ lookup('env', 'DOCKERHUB_USERNAME') | default('ziedth', true) }}"

  tasks:
    - name: Install project dependencies
      ansible.builtin.command: make install
      args:
        chdir: "{{ project_dir }}"
      tags: [setup]

    - name: Start the Docker Compose stack
      ansible.builtin.command: make up
      args:
        chdir: "{{ project_dir }}"
      tags: [stack, training]

    - name: Wait for the MLflow tracking server
      ansible.builtin.uri:
        url: http://127.0.0.1:5000/health
        method: GET
        status_code: 200
      register: mlflow_health
      until: mlflow_health.status == 200
      retries: 60
      delay: 5
      tags: [stack, training]

    - name: Run formatting, lint, and security checks
      ansible.builtin.command: make check
      args:
        chdir: "{{ project_dir }}"
      tags: [quality]

    - name: Run project tests
      ansible.builtin.command: make test
      args:
        chdir: "{{ project_dir }}"
      tags: [tests]

    - name: Train project models
      ansible.builtin.command: make "{{ item }}"
      args:
        chdir: "{{ project_dir }}"
      environment:
        MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      loop:
        - train_model
        - train_hex_model
        - train_iris_model
      tags: [training]

    - name: Require Docker Hub token for deployment
      ansible.builtin.assert:
        that:
          - lookup('env', 'DOCKERHUB_TOKEN') | length > 0
        fail_msg: Set DOCKERHUB_TOKEN in the Ansible UI server environment before deployment.
      tags: [deployment, never]

    - name: Log in to Docker Hub
      ansible.builtin.command:
        argv:
          - docker
          - login
          - --username
          - "{{ dockerhub_username }}"
          - --password-stdin
        stdin: "{{ lookup('env', 'DOCKERHUB_TOKEN') }}"
        stdin_add_newline: false
      no_log: true
      tags: [deployment, never]

    - name: Build the MLOps application image
      ansible.builtin.command: docker compose build mlopsapp
      args:
        chdir: "{{ project_dir }}"
      tags: [deployment, never]

    - name: Push the MLOps application image to Docker Hub
      ansible.builtin.command: docker compose push mlopsapp
      args:
        chdir: "{{ project_dir }}"
      tags: [deployment, never]
